<!DOCTYPE html>
<html lang="en">
<head>
<!-- Vesper City: Ember Isle — open-world crime game: 20 story missions, wanted 0-6, VCPD Air One helicopter, roadblocks, spike strips, respect & crew (Lena Voss, Rook, Dario Kess), GPS mission beacon, 6 street races, 10 businesses, garage upgrades, weapon wheel, 8 radio stations, ferry to volcanic Ember Isle, 42 Sun Coins, 3 save slots. Raw WebGL, offline, no libraries. -->
<meta name="description" content="Vesper City: Ember Isle — open-world crime game: 20 story missions, wanted 0-6, VCPD Air One helicopter, roadblocks, spike strips, respect & crew (Lena Voss, Rook, Dario Kess), GPS mission beacon, 6 street races, 10 businesses, garage upgrades, weapon wheel, 8 radio stations, ferry to volcanic Ember Isle, 42 Sun Coins, 3 save slots. Raw WebGL, offline, no libraries.">
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesper City: Ember Isle — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a0f08; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #top-left { position: absolute; top: 14px; left: 16px; }
  #cash { font-size: 30px; font-weight: 800; color: #7dff8a; text-shadow: 0 2px 6px #000; }
  #health-bar { width: 200px; height: 14px; background: rgba(0,0,0,.55); border: 1px solid #fff3; margin-top: 6px; position: relative; }
  #health-fill { height: 100%; width: 100%; background: #37d67a; }
  #health-text { position: absolute; right: 6px; top: -2px; font-size: 11px; }
  #wanted { font-size: 22px; letter-spacing: 3px; margin-top: 6px; text-shadow: 0 2px 4px #000; }
  #rank { font-size: 13px; color: #ffd23c; margin-top: 4px; text-shadow: 0 1px 3px #000; }
  #mission-panel { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 420px; max-width: 46vw; background: rgba(10,10,16,.62); border-left: 4px solid #ff9a3c; padding: 10px 14px; }
  #mission-title { font-size: 15px; font-weight: 800; color: #ff9a3c; }
  #mission-brief { font-size: 13px; margin-top: 4px; line-height: 1.35; }
  #mission-count { font-size: 12px; color: #ffd23c; margin-top: 4px; }
  #respect-line { font-size: 12px; color: #7dff8a; margin-top: 4px; }
  #top-right { position: absolute; top: 14px; right: 16px; text-align: right; font-size: 14px; text-shadow: 0 1px 3px #000; }
  #clock { font-size: 24px; font-weight: 700; }
  #weather { color: #ffb02e; margin-top: 2px; }
  #radio, #coins { margin-top: 2px; color: #cfe8ff; }
  #speed-box { position: absolute; right: 20px; bottom: 210px; font-size: 40px; font-weight: 800; text-shadow: 0 2px 6px #000; }
  #speed-unit { font-size: 14px; margin-left: 4px; }
  #minimap { position: absolute; right: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; background: rgba(10,12,20,.8); }
  #toast { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: 10px 18px; border-radius: 6px; font-size: 15px; transition: opacity .4s; white-space: nowrap; }
  #weapon-wheel { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.72); padding: 14px 18px; border-radius: 10px; }
  .wheel-item { font-size: 15px; padding: 5px 10px; color: #ddd; }
  .wheel-item.active { color: #ffd23c; font-weight: 800; }
  #controls-hint { position: absolute; bottom: 12px; left: 16px; font-size: 11px; color: #ddd; background: rgba(0,0,0,.5); padding: 6px 10px; max-width: 520px; line-height: 1.5; }
  #title-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(20,8,2,.25), rgba(20,8,2,.72)); text-align: center; }
  #title-screen h1 { font-size: 84px; margin: 0; letter-spacing: 6px; color: #ffd23c; text-shadow: 0 4px 0 #7a2e00, 0 8px 24px #000; }
  #title-screen h2 { font-size: 40px; margin: 0; letter-spacing: 14px; color: #ff7a3c; text-shadow: 0 3px 12px #000; }
  #title-screen .tagline { font-size: 20px; margin-top: 14px; color: #fff; }
  #title-screen .start { font-size: 18px; color: #7dff8a; margin-top: 26px; animation: pulse 1.4s infinite; }
  #title-screen .credits { font-size: 13px; color: #ddd; margin-top: 18px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  #pause-screen, #map-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,5,12,.82); }
  #pause-screen h1, #map-screen h1 { font-size: 40px; letter-spacing: 4px; }
  #bigmap { border: 2px solid #fff3; background: #0e1a2e; }
</style>
</head>
<body>
<script type="module" src="./src/main.js"></script>
</body>
</html>
