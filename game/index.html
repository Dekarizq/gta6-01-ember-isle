<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Vesper City: Ember Isle — a make.fun GTA 6 bounty entry</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1210; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f5e6c8; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .hud-topleft { position: absolute; top: 12px; left: 12px; }
  .hud-cash { font-size: 30px; font-weight: 800; color: #ffd166; letter-spacing: 1px; }
  .hud-health { font-size: 13px; margin-top: 2px; color: #e8dcc0; }
  .hud-wanted { font-size: 15px; font-weight: 700; color: #ff5a5a; margin-top: 2px; }
  .hud-rank { font-size: 13px; color: #ffd166; margin-top: 2px; }
  .hud-mission { position: absolute; top: 150px; left: 12px; width: 300px; background: rgba(20,12,8,.72); border: 1px solid rgba(255,209,102,.5); border-radius: 8px; padding: 10px 12px; }
  .hud-mission-title { font-size: 14px; font-weight: 800; color: #ffd166; }
  .hud-mission-step { font-size: 13px; margin-top: 4px; line-height: 1.35; }
  .hud-mission-next { font-size: 12px; color: #9fd8ff; margin-top: 4px; }
  .hud-right { position: absolute; top: 12px; right: 12px; width: 260px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .hud-chip { background: rgba(20,12,8,.72); border: 1px solid rgba(255,209,102,.35); border-radius: 6px; padding: 5px 9px; font-size: 12px; text-align: right; max-width: 260px; }
  .hud-speed { position: absolute; bottom: 12px; left: 12px; font-size: 22px; font-weight: 800; color: #ffd166; white-space: pre-line; line-height: 1.1; }
  .hud-controls { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #d8c8a8; background: rgba(20,12,8,.6); padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
  .hud-toast { position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%); max-width: 640px; background: rgba(20,12,8,.85); border: 1px solid rgba(255,209,102,.6); border-radius: 8px; padding: 9px 14px; font-size: 14px; text-align: center; transition: opacity .3s; }
  .hud-wheel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; background: rgba(20,12,8,.85); border: 1px solid rgba(255,209,102,.6); border-radius: 10px; padding: 12px 16px; font-size: 15px; line-height: 1.7; }
  .hud-wheel .sel { color: #ffd166; font-weight: 800; }
  .hud-minimap { position: absolute; bottom: 12px; right: 12px; width: 180px; height: 180px; border: 2px solid rgba(255,209,102,.7); border-radius: 8px; background: #1a2a3a; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #f5e6c8; background: linear-gradient(180deg, rgba(26,10,4,.55), rgba(26,10,4,.82)); pointer-events: none; }
  #title-name { font-size: 72px; font-weight: 900; letter-spacing: 6px; color: #ffd166; text-shadow: 0 4px 24px rgba(0,0,0,.9); }
  #title-sub { font-size: 34px; font-weight: 700; letter-spacing: 12px; color: #ff8c42; margin-top: 4px; }
  #title-tag { font-size: 17px; margin-top: 18px; color: #f5e6c8; max-width: 620px; line-height: 1.5; }
  #title-prompt { font-size: 15px; margin-top: 28px; color: #ffd166; font-weight: 700; animation: blink 1.6s infinite; }
  #title-stats { font-size: 13px; margin-top: 14px; color: #d8c8a8; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="title">
  <div id="title-name">VESPER CITY</div>
  <div id="title-sub">EMBER ISLE</div>
  <div id="title-tag">A golden-hour open world. Twenty missions. One volcano. One crown.</div>
  <div id="title-prompt">Press ENTER or click to start · WASD to drive · E to steal a car</div>
  <div id="title-stats">20 story missions · 8 radio stations · ferry to Ember Isle · 6 street races</div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
